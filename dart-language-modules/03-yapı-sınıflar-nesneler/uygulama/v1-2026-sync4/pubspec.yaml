# DART KONUSU: Metadata — paket düzeyindeki meta veriler (name, description,
# version, environment, homepage, repository, issue_tracker, topics).
name: sarkisla_yoklama
description: >-
  Şarkışla Uygulamalı Bilimler Yüksekokulu için blockchain destekli dijital
  yoklama uygulaması. Yoklama kayıtları Proof of Authority ile imzalanan,
  değiştirilemez bir zincirde tutulur.
version: 1.0.0+1
homepage: https://sarkisla.cumhuriyet.edu.tr
repository: https://github.com/sarkisla-ubyo/sarkisla_yoklama
issue_tracker: https://github.com/sarkisla-ubyo/sarkisla_yoklama/issues
topics:
  - blockchain
  - attendance
  - education
  - flutter
publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  cloud_firestore: ^6.10.0      # bulut senkronizasyonu
  collection: ^1.19.1
  crypto: ^3.0.7                # SHA-256
  cryptography: ^2.9.0          # Ed25519 imza (PoA)
  csv: ^8.0.0                   # rapor dışa aktarma
  cupertino_icons: ^1.0.8
  drift: ^2.35.1                # yerel SQLite zinciri
  drift_flutter: ^0.3.1
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  fl_chart: ^1.2.0              # devam grafikleri
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2       # Framer Motion benzeri animasyonlar
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3      # durum yönetimi
  flutter_secure_storage: ^11.2.0  # özel anahtarlar
  geolocator: ^14.1.1           # kampüs coğrafi sınırı
  go_router: ^18.0.2            # rol bazlı navigasyon
  http: ^1.6.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  local_auth: ^3.0.2            # biyometrik doğrulama
  meta: ^1.19.0                 # @immutable, @protected …
  mobile_scanner: ^7.4.2        # QR tarama
  path_provider: ^2.1.6
  pdf: ^3.13.1                  # PDF rapor
  qr_flutter: ^4.1.0            # QR üretme
  share_plus: ^13.3.1
  sqlite3: 3.7.0
  uuid: ^4.6.0
  wallet: ^0.0.18               # EthereumAddress (web3dart 3)
  web3dart: ^3.0.3              # ileride Ethereum/Polygon geçişi

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.1
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  # Yazı tipleri (SIL Open Font License, lisanslar assets/fonts/ altında):
  # Inter (gövde), Newsreader (başlıklar), Fira Code (hash'ler).
  # Uygulamaya gömülüdür: çevrimdışı çalışır ve PDF raporlarında Türkçe
  # karakterler (ş, ğ, ı, İ) doğru görünür.
  assets:
    - assets/images/okul_logo.png
    - assets/images/campus_bg.jpg
    - assets/fonts/Inter-Regular.ttf
    - assets/fonts/Inter-SemiBold.ttf
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Variable.ttf
        - asset: assets/fonts/Newsreader-Italic-Variable.ttf
          style: italic
    - family: FiraCode
      fonts:
        - asset: assets/fonts/FiraCode-Variable.ttf

# Uygulama simgesi: Sivas Cumhuriyet Üniversitesi mührü.
# Üretmek için: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  min_sdk_android: 23
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#F7F6F3"
    theme_color: "#8C1C2B"
